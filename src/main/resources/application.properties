spring.application.name=sshop

server.port=5050
server.forward-headers-strategy=framework

# Database configuration - REQUIRED: Set DB environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##(create, update, create-drop, validate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

api.prefix=/api/v1

# JWT Configuration - REQUIRED: Set JWT_SECRET environment variable
sshop.app.jwtSecret=${JWT_SECRET}
sshop.app.jwtExpirationMs=${JWT_EXPIRATION}
sshop.app.refreshTokenExpirationMs=${JWT_REFRESH_EXPIRATION}

# Optional seed passwords (leave empty to skip seeding)
sshop.seed.user.password=${SSHOP_SEED_USER_PASSWORD}
sshop.seed.admin.password=${SSHOP_SEED_ADMIN_PASSWORD}

# PayOS Integration
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url-base=${PAYOS_RETURN_URL_BASE}
payos.cancel-url-base=${PAYOS_CANCEL_URL_BASE}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html