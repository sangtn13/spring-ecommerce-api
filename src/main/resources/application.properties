spring.application.name=sshop

server.port=5050
server.forward-headers-strategy=framework

# Database configuration - REQUIRED: Set DB environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

##(create, update, create-drop, validate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Redis configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# SMTP mail configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT}

api.prefix=/api/v1

# JWT Configuration - REQUIRED: Set JWT_SECRET environment variable
sshop.app.jwtSecret=${JWT_SECRET}
sshop.app.jwtExpirationMs=${JWT_EXPIRATION}
sshop.app.refreshTokenExpirationMs=${JWT_REFRESH_EXPIRATION}
sshop.app.passwordResetTokenExpirationMs=${PASSWORD_RESET_TOKEN_EXPIRATION}
sshop.app.passwordResetEmailCooldownMs=${PASSWORD_RESET_EMAIL_COOLDOWN:120000}
sshop.app.passwordResetIpRateLimitWindowMs=${PASSWORD_RESET_IP_RATE_LIMIT_WINDOW:900000}
sshop.app.passwordResetIpRateLimitMaxRequests=${PASSWORD_RESET_IP_RATE_LIMIT_MAX_REQUESTS:10}
sshop.app.resetPasswordBaseUrl=${RESET_PASSWORD_BASE_URL:http://localhost:3000/reset-password}
sshop.mail.fromName=${MAIL_FROM_NAME}
sshop.mail.fromAddress=${MAIL_FROM_ADDRESS}
sshop.mail.supportEmail=${MAIL_SUPPORT_EMAIL}

# Optional seed passwords (leave empty to skip seeding)
sshop.seed.user.password=${SSHOP_SEED_USER_PASSWORD}
sshop.seed.admin.password=${SSHOP_SEED_ADMIN_PASSWORD}

# PayOS Integration
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url-base=${PAYOS_RETURN_URL_BASE}
payos.cancel-url-base=${PAYOS_CANCEL_URL_BASE}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
