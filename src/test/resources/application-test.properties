# Test Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate properties for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Use H2 dialect for testing
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Set globally quoted identifiers to false to avoid issues with reserved keywords in H2
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Disable data initialization for tests
spring.sql.init.mode=never

# Disable Flyway for H2 tests (MySQL-specific migrations)
spring.flyway.enabled=false

# Redis configuration for tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

# SMTP mail configuration for tests
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000

